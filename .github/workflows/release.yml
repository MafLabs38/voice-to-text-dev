name: Build and release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Résout la version depuis le tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Installe l'outil de packaging Velopack (vpk)
        run: dotnet tool install -g vpk --version 1.2.158

      - name: Publie l'appli (self-contained, win-x64)
        # Pas de PublishSingleFile : Velopack a besoin des fichiers individuels (exe + dll) pour
        # calculer les deltas entre versions et générer un exécutable conscient des mises à jour.
        run: >
          dotnet publish src/VoiceToText/VoiceToText.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Empaquette avec Velopack (installeur + paquets de mise à jour)
        # packId volontairement différent du nom du dossier de données de l'appli
        # (%LocalAppData%\VoiceToTextDictation, cf. AppPaths.RootDirectory) : Velopack installe
        # sous %LocalAppData%\<packId>\, un même nom aurait mélangé install Velopack et données user.
        run: >
          vpk pack --packId VoiceToTextDictationApp --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe VoiceToText.exe
          --packTitle "Dictée universelle" --packAuthors MafLabs38
          --icon src/VoiceToText/Assets/icon.ico --runtime win-x64 -o dist

      - name: Publie la release GitHub (installeur + assets de mise à jour automatique)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl https://github.com/MafLabs38/voice-to-text-dev --outputDir dist --token $env:GH_TOKEN --tag ${{ github.ref_name }} --publish true
          gh release edit "${{ github.ref_name }}" --title "Dictée universelle ${{ steps.version.outputs.version }}" --generate-notes

      - name: Dépose les paquets comme artefact du run (branches non taguées)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*
